<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1a3a">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Credito">
<title>Credito · Bar Stuoie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --notte:#0f1a3a; --blu:#18285a; --blu-2:#1f3270; --riga:#ffffff14;
  --gesso:#f2efe6; --nebbia:#9aa3c2;
  --rosso:#e0453c; --rosso-scuro:#b8281f; --oro:#d4ad55; --prato:#46b673;
  --cond:"Barlow Condensed",system-ui,sans-serif;
  --text:"Barlow",system-ui,-apple-system,sans-serif;
  --safe-b:env(safe-area-inset-bottom);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--notte)}
body{font:400 16px/1.45 var(--text);color:var(--gesso);background:var(--notte);min-height:100vh;
  padding-top:env(safe-area-inset-top);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--oro);outline-offset:2px;border-radius:8px}
.hidden{display:none!important}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.01em}

/* ---------- accesso ---------- */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px calc(32px + var(--safe-b));
  background:radial-gradient(120% 70% at 50% 0%,#22377a 0%,var(--notte) 60%)}
#login img{width:132px;filter:drop-shadow(0 14px 30px #0008)}
#login h1{font:600 30px/1 var(--cond);margin:22px 0 4px}
#login p{color:var(--nebbia);font-size:15px}
.dots{display:flex;gap:16px;height:14px;margin:30px 0 34px}
.dots span{width:13px;height:13px;border-radius:50%;border:1.5px solid #ffffff55;transition:background .12s,border-color .12s,transform .12s}
.dots span.on{background:var(--oro);border-color:var(--oro);transform:scale(1.1)}
.pad{display:grid;grid-template-columns:repeat(3,74px);gap:16px 26px}
.pad button{height:74px;border-radius:50%;font:500 30px/1 var(--cond);border:1px solid #ffffff1f;background:#ffffff08}
.pad button:active{background:#ffffff26}
.pad .t{border:0;background:none;font:500 16px var(--text);color:var(--nebbia)}
#login-msg{height:22px;margin-top:22px;color:#ff9b93;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- struttura ---------- */
#app{max-width:1180px;margin:0 auto}
.pane{min-height:100vh;padding-bottom:calc(110px + var(--safe-b))}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 20px;
  background:color-mix(in srgb,var(--notte) 86%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.bar .brand img{width:30px}
.bar .brand b{font:600 21px/1 var(--cond)}
.ic{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;flex:none;color:var(--gesso)}
.ic:active{background:var(--riga)}
.ic svg{width:22px;height:22px}

/* ---------- elenco ---------- */
.board{padding:18px 20px 26px}
.board .lab{color:var(--nebbia);font-size:15px}
.board .tot{font:700 76px/.95 var(--cond);color:var(--oro);margin:6px 0 10px;letter-spacing:-.02em}
.board .tot small{font-size:.5em;font-weight:600;margin-right:6px;opacity:.85}
.board .sub{color:var(--nebbia);font-size:15px}
.board .sub b{color:var(--gesso);font-weight:600}

.tools{display:flex;gap:10px;padding:0 20px 14px;position:sticky;top:66px;z-index:4;background:var(--notte)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:23px;background:var(--blu)}
.search svg{width:18px;height:18px;color:var(--nebbia);flex:none}
.search input{flex:1;min-width:0;outline:none;height:100%}
.search input::placeholder{color:var(--nebbia)}
.seg{display:flex;padding:4px;border-radius:23px;background:var(--blu);flex:none}
.seg button{height:38px;padding:0 12px;border-radius:19px;font-size:14px;font-weight:500;color:var(--nebbia)}
.seg button.on{background:var(--gesso);color:var(--notte)}

.list{padding:0 8px}
.cl{display:flex;align-items:center;gap:14px;width:100%;padding:13px 12px;border-radius:14px;text-align:left;position:relative}
.cl:active,.cl.sel{background:var(--blu)}
.cl+.cl::before{content:"";position:absolute;left:66px;right:12px;top:0;border-top:1px solid var(--riga)}
.cl.sel::before,.cl.sel+.cl::before{display:none}
.av{width:42px;height:42px;border-radius:50%;flex:none;display:grid;place-items:center;font:600 17px var(--cond);background:var(--blu-2);color:var(--gesso)}
.cl.debt .av{box-shadow:inset 0 0 0 2px var(--rosso)}
.cl .nm{flex:1;min-width:0}
.cl .nm b{display:block;font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cl .nm small{color:var(--nebbia);font-size:14px}
.cl .v{font:600 23px/1 var(--cond);font-variant-numeric:tabular-nums}
.v.debt{color:var(--rosso)} .v.paid{color:var(--prato)} .v.zero{color:var(--nebbia);font-weight:500}
.empty{padding:56px 24px;text-align:center;color:var(--nebbia)}
.empty b{display:block;font:600 24px var(--cond);color:var(--gesso);margin-bottom:4px}
.loading{padding:48px;text-align:center;color:var(--nebbia)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:14px 20px calc(14px + var(--safe-b));
  background:linear-gradient(transparent,var(--notte) 40%);pointer-events:none}
.dock button{pointer-events:auto}
.cta{width:100%;max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:10px;height:56px;border-radius:28px;
  background:var(--oro);color:var(--notte);font:600 19px var(--cond);letter-spacing:.01em;box-shadow:0 10px 30px #0007}
.cta svg{width:20px;height:20px}
.cta:active{transform:scale(.98)}

/* ---------- cliente ---------- */
.hero{padding:10px 20px 24px}
.hero h2{font:600 34px/1.05 var(--cond);overflow-wrap:anywhere}
.hero .since{color:var(--nebbia);font-size:15px;margin-top:4px}
.hero .bal{font:700 92px/.9 var(--cond);font-variant-numeric:tabular-nums;letter-spacing:-.025em;margin-top:22px}
.hero .bal small{font-size:.45em;font-weight:600;margin-right:6px;opacity:.85}
.hero .state{font-size:15px;color:var(--nebbia);margin-top:8px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 20px}
.btn{height:58px;border-radius:18px;font:600 20px var(--cond);letter-spacing:.01em;display:flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.35;transform:none}
.btn.r{background:var(--rosso);color:#fff}
.btn.g{background:var(--prato);color:#06210f}
.btn.o{grid-column:1/-1;background:transparent;border:1.5px solid #46b67388;color:var(--prato);height:52px}
.btn.s{background:var(--blu-2);color:var(--gesso)}
.btn.w{background:var(--gesso);color:var(--notte)}

.hist{padding:30px 20px 0}
.day{color:var(--nebbia);font-size:14px;font-weight:500;padding:16px 0 6px}
.day:first-child{padding-top:0}
.mv{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid var(--riga)}
.day+.mv{border-top:0}
.mv .dot{width:34px;height:34px;border-radius:50%;flex:none;display:grid;place-items:center}
.mv .dot svg{width:16px;height:16px}
.mv .dot.debt{background:#e0453c22;color:var(--rosso)}
.mv .dot.paid{background:#46b67322;color:var(--prato)}
.mv .nm{flex:1;min-width:0}
.mv .nm b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv .nm small{color:var(--nebbia);font-size:14px}
.mv .v{font:600 21px/1 var(--cond);font-variant-numeric:tabular-nums}
.mv.off .nm b,.mv.off .v{text-decoration:line-through;opacity:.4}
.mv .x{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--nebbia);flex:none}
.mv .x svg{width:17px;height:17px}
.mv .x:active{background:var(--riga)}

.blank{display:none}

/* ---------- fogli ---------- */
.veil{position:fixed;inset:0;z-index:20;background:#050a1ccc;display:flex;align-items:flex-end;justify-content:center;animation:fade .16s}
.sheet{width:100%;max-width:520px;background:var(--blu);border-radius:28px 28px 0 0;padding:10px 20px calc(20px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grip{width:40px;height:5px;border-radius:3px;background:#ffffff33;margin:0 auto 16px}
.sheet h3{font:600 26px/1.1 var(--cond);margin-bottom:16px}
.amount{display:flex;align-items:baseline;justify-content:center;gap:6px;padding:6px 0 14px}
.amount span{font:600 40px var(--cond);color:var(--nebbia)}
.amount input{width:100%;max-width:260px;text-align:center;font:700 72px/1 var(--cond);font-variant-numeric:tabular-nums;outline:none;caret-color:var(--oro)}
.amount input::placeholder{color:#ffffff30}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chips button{flex:1;height:44px;border-radius:14px;background:var(--blu-2);font:600 18px var(--cond)}
.chips button:active{background:#2b4290}
.field{width:100%;height:52px;padding:0 16px;border-radius:16px;background:var(--notte);outline:none;margin-bottom:12px;border:1.5px solid transparent}
.field:focus{border-color:var(--oro)}
.field::placeholder{color:var(--nebbia)}
.pair{display:grid;grid-template-columns:1fr 1.6fr;gap:10px;margin-top:4px}
.confirm{text-align:center;padding:4px 0 20px}
.confirm .v{font:700 64px/1 var(--cond);color:var(--prato)}
.menu button{display:flex;align-items:center;gap:14px;width:100%;height:56px;font-size:17px;border-top:1px solid var(--riga)}
.menu button:first-child{border-top:0}
.menu svg{width:21px;height:21px;color:var(--nebbia)}
.menu .red,.menu .red svg{color:var(--rosso)}

.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);z-index:30;
  display:flex;align-items:center;gap:10px;padding:13px 18px;border-radius:16px;background:var(--gesso);color:var(--notte);font-weight:500;
  box-shadow:0 12px 30px #0008;animation:pop .22s cubic-bezier(.2,.8,.2,1);white-space:nowrap}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--prato)}
.toast.err i{background:var(--rosso)}

@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:translate(-50%,12px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- tablet: due colonne ---------- */
@media (min-width:900px){
  #app.on{display:grid;grid-template-columns:420px 1fr;gap:0}
  #app.on #home,#app.on #detail{display:block!important;height:100vh;overflow-y:auto}
  #home{border-right:1px solid var(--riga)}
  #detail{background:#132151}
  #detail .bar{background:color-mix(in srgb,#132151 86%,transparent)}
  #btn-back{visibility:hidden}
  #detail.none .bar,#detail.none .hero,#detail.none .acts,#detail.none .hist{display:none}
  #detail.none .blank{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:14px;color:var(--nebbia)}
  .blank img{width:120px;opacity:.35}
  .tools{top:66px}
  #app.on #home{display:flex!important;flex-direction:column;padding-bottom:0}
  #home .list{flex:1}
  .dock{position:sticky;bottom:0}
  .hero,.acts,.hist{max-width:640px;margin-left:auto;margin-right:auto}
  .hero{padding-top:40px}
  .hero .bal{font-size:120px}
  .toast{bottom:40px}
}
</style>
</head>
<body>

<section id="login">
  <img src="logo.png" alt="Bar Stuoie">
  <h1>Credito</h1>
  <p>Inserisci il PIN</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="login-msg"></div>
</section>

<div id="app" class="hidden">
  <section id="home" class="pane">
    <div class="bar">
      <div class="brand"><img src="logo.png" alt=""><b>Bar Stuoie</b></div>
      <button class="ic" id="btn-refresh" aria-label="Aggiorna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
      <button class="ic" id="btn-settings" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="board">
      <div class="lab">Da incassare</div>
      <div class="tot num" id="tot"><small>€</small>0,00</div>
      <div class="sub" id="tot-sub"></div>
    </div>
    <div class="tools">
      <label class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg><input id="q" type="search" placeholder="Cerca cliente" autocomplete="off"></label>
      <div class="seg"><button class="on" data-f="aperti">Aperti</button><button data-f="tutti">Tutti</button></div>
    </div>
    <div class="list" id="list"><div class="loading">Caricamento…</div></div>
    <div class="dock"><button class="cta" id="btn-new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Nuovo cliente</button></div>
  </section>

  <section id="detail" class="pane hidden none">
    <div class="bar">
      <button class="ic" id="btn-back" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
      <div class="brand"></div>
      <button class="ic" id="btn-cmenu" aria-label="Opzioni cliente"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></button>
    </div>
    <div class="hero">
      <h2 id="d-name"></h2>
      <div class="since" id="d-since"></div>
      <div class="bal num" id="d-bal"></div>
      <div class="state" id="d-state"></div>
    </div>
    <div class="acts">
      <button class="btn r" id="btn-debt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Segna</button>
      <button class="btn g" id="btn-pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>Paga</button>
      <button class="btn o" id="btn-all">Salda tutto</button>
    </div>
    <div class="hist" id="mv"></div>
    <div class="blank"><img src="logo.png" alt=""><span>Scegli un cliente</span></div>
  </section>
</div>

<div id="sheet-root"></div>

<script>
const SB_URL = "https://fgluxtcxukljiuiayaoh.supabase.co";
const SB_KEY = "sb_publishable_F7SOqYxwlm4-RuP5CHvHCQ_ROFRDYQx";
const PIN_KEY = "credito_pin";

let pin = null;
try { pin = localStorage.getItem(PIN_KEY); } catch(e) {}
let clienti = [], filtro = "aperti", corrente = null;

const $ = s => document.querySelector(s);
const wide = () => matchMedia("(min-width:900px)").matches;
const fmt = n => Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = n => "€ " + fmt(n);
const big = n => `<small>€</small>${fmt(n)}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniziali = n => (n.match(/\p{L}+/gu) || ["?"]).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const ICON = {
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  minus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M5 12h14"/></svg>',
  undo:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
};

function giorno(d){
  const oggi = new Date(), g = new Date(oggi.getFullYear(),oggi.getMonth(),oggi.getDate());
  const diff = Math.round((g - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(diff===0) return "Oggi";
  if(diff===1) return "Ieri";
  const o = {weekday:"long",day:"numeric",month:"long"};
  if(d.getFullYear()!==oggi.getFullYear()) o.year="numeric";
  const s = d.toLocaleDateString("it-IT",o);
  return s[0].toUpperCase()+s.slice(1);
}
const ora = d => d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
function quando(iso){
  if(!iso) return "Nessun movimento";
  const d = new Date(iso), g = giorno(d);
  return (g==="Oggi"||g==="Ieri" ? g.toLowerCase() : d.toLocaleDateString("it-IT",{day:"numeric",month:"short"})) + " alle " + ora(d);
}

async function rpc(fn, args = {}){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({p_pin: pin, ...args})
  });
  if(!r.ok) throw new Error((await r.text()) || r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

function toast(msg, err){
  document.querySelectorAll(".toast").forEach(t=>t.remove());
  const t = document.createElement("div");
  t.className = "toast" + (err ? " err" : "");
  t.innerHTML = `<i></i>${esc(msg)}`;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2400);
}
const offline = () => toast("Nessuna connessione, riprova", true);

/* ---------- navigazione ---------- */
function vista(v){
  $("#login").classList.toggle("hidden", v!=="login");
  $("#app").classList.toggle("hidden", v==="login");
  $("#app").classList.add("on");
  if(v==="login") return;
  if(!wide()){
    $("#home").classList.toggle("hidden", v!=="home");
    $("#detail").classList.toggle("hidden", v!=="detail");
    window.scrollTo(0,0);
  }
}
addEventListener("resize", () => {
  if($("#app").classList.contains("hidden")) return;
  if(wide()){ $("#home").classList.remove("hidden"); $("#detail").classList.remove("hidden"); }
  else vista(corrente && !$("#detail").classList.contains("none") ? "detail" : "home");
});

function esci(){
  pin = null; corrente = null;
  try { localStorage.removeItem(PIN_KEY); } catch(e) {}
  chiudi(); vista("login"); resetPad();
}

/* ---------- accesso ---------- */
let digits = "";
function resetPad(){ digits=""; drawDots(); }
function drawDots(){
  $("#dots").innerHTML = Array.from({length:Math.max(4,digits.length)},(_,i)=>`<span class="${i<digits.length?"on":""}"></span>`).join("");
}
function buildPad(){
  const keys = ["1","2","3","4","5","6","7","8","9","del","0","ok"];
  $("#pad").innerHTML = keys.map(k => k==="del" ? `<button class="t" data-k="del">Cancella</button>`
    : k==="ok" ? `<button class="t" data-k="ok">Entra</button>` : `<button data-k="${k}">${k}</button>`).join("");
  $("#pad").onclick = e => {
    const k = e.target.closest("button")?.dataset.k; if(!k) return;
    $("#login-msg").textContent = "";
    if(k==="del") digits = digits.slice(0,-1);
    else if(k==="ok") { if(digits.length>=4) prova(); return; }
    else if(digits.length<8) digits += k;
    drawDots();
  };
  addEventListener("keydown", e => {
    if($("#login").classList.contains("hidden")) return;
    if(/^\d$/.test(e.key) && digits.length<8){ digits+=e.key; drawDots(); }
    else if(e.key==="Backspace"){ digits=digits.slice(0,-1); drawDots(); }
    else if(e.key==="Enter" && digits.length>=4) prova();
  });
}
async function prova(){
  pin = digits;
  try{
    const r = await rpc("accedi");
    if(r==="ok"){
      try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}
      vista("home"); carica();
    } else {
      pin = null;
      $("#login-msg").textContent = r==="bloccato" ? "Troppi tentativi. Riprova tra 10 minuti" : "PIN errato";
      const d = $("#dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      resetPad();
    }
  }catch(e){ pin=null; $("#login-msg").textContent = "Nessuna connessione"; resetPad(); }
}

/* ---------- elenco ---------- */
async function carica(){
  try{
    const r = await rpc("elenco_clienti");
    if(!Array.isArray(r)) return esci();
    clienti = r.map(c => ({...c, saldo:Number(c.saldo)}));
    disegnaLista();
    if(corrente){ const c = clienti.find(x=>x.id===corrente.id); if(c){ corrente = {...corrente, ...c}; disegnaTesta(); } }
  }catch(e){ offline(); }
}

function disegnaLista(){
  const aperti = clienti.filter(c => c.saldo > 0.004);
  const tot = aperti.reduce((s,c)=>s+c.saldo,0);
  $("#tot").innerHTML = big(tot);
  $("#tot-sub").innerHTML = aperti.length ? `<b>${aperti.length}</b> ${aperti.length===1?"conto aperto":"conti aperti"}` : "Tutti in pari";
  const q = $("#q").value.trim().toLowerCase();
  let l = clienti.filter(c => c.nome.toLowerCase().includes(q));
  if(filtro==="aperti" && !q) l = l.filter(c => Math.abs(c.saldo) >= 0.005);
  if(filtro==="aperti" && !q) l.sort((a,b)=>b.saldo-a.saldo);
  if(!l.length){
    $("#list").innerHTML = q ? `<div class="empty"><b>Nessun risultato</b>Nessun cliente si chiama “${esc(q)}”</div>`
      : filtro==="aperti" ? `<div class="empty"><b>Nessun conto aperto</b>Quando qualcuno segna, compare qui</div>`
      : `<div class="empty"><b>Ancora nessun cliente</b>Aggiungi il primo con Nuovo cliente</div>`;
    return;
  }
  $("#list").innerHTML = l.map(c => {
    const cls = c.saldo>0.004 ? "debt" : c.saldo<-0.004 ? "paid" : "zero";
    const sel = corrente && corrente.id===c.id && wide() ? " sel" : "";
    return `<button class="cl ${cls}${sel}" data-id="${c.id}">
      <span class="av">${esc(iniziali(c.nome))}</span>
      <span class="nm"><b>${esc(c.nome)}</b><small>${quando(c.ultimo)}</small></span>
      <span class="v ${cls}">${c.saldo<-0.004 ? "+"+fmt(-c.saldo) : fmt(c.saldo)}</span>
    </button>`;
  }).join("");
}

$("#list").onclick = e => { const id = e.target.closest(".cl")?.dataset.id; if(id) apri(id); };
$("#q").oninput = disegnaLista;
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".seg button").forEach(x => x.classList.toggle("on", x===b));
  disegnaLista();
});
$("#btn-refresh").onclick = async () => { await carica(); if(corrente) caricaMovimenti(); toast("Aggiornato"); };
$("#btn-new").onclick = () => foglioNome("Nuovo cliente", "", "Aggiungi", async nome => {
  const id = await rpc("nuovo_cliente",{p_nome:nome});
  if(!id) return esci();
  await carica(); apri(id); toast("Aggiunto " + nome);
});
$("#btn-settings").onclick = () => foglio(`
  <div class="menu">
    <button data-a="pin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>Cambia PIN</button>
    <button data-a="esci" class="red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/></svg>Esci da questo dispositivo</button>
  </div>`, el => {
    el.querySelector("[data-a=pin]").onclick = foglioPin;
    el.querySelector("[data-a=esci]").onclick = esci;
  });

/* ---------- cliente ---------- */
async function apri(id){
  corrente = {...(clienti.find(c => c.id===id) || {id, nome:"", saldo:0})};
  $("#detail").classList.remove("none");
  $("#mv").innerHTML = `<div class="loading">Caricamento…</div>`;
  disegnaTesta(); disegnaLista();
  vista("detail");
  if(wide()) $("#detail").scrollTo(0,0);
  await caricaMovimenti();
}

function disegnaTesta(){
  const s = corrente.saldo;
  $("#d-name").textContent = corrente.nome;
  const el = $("#d-bal");
  el.innerHTML = big(Math.abs(s));
  el.style.color = s>0.004 ? "var(--rosso)" : s<-0.004 ? "var(--prato)" : "var(--gesso)";
  $("#d-state").textContent = s>0.004 ? "Da pagare" : s<-0.004 ? "A credito del cliente" : "In pari";
  $("#btn-all").disabled = !(s>0.004);
  $("#btn-all").textContent = s>0.004 ? "Salda tutto  " + eur(s) : "Salda tutto";
}

async function caricaMovimenti(){
  const id = corrente.id;
  try{
    const r = await rpc("movimenti_cliente",{p_cliente:id});
    if(!Array.isArray(r)) return esci();
    if(!corrente || corrente.id!==id) return;
    corrente.saldo = r.filter(m=>!m.annullato).reduce((s,m)=>s+(m.tipo==="debito"?1:-1)*Number(m.importo),0);
    const c = clienti.find(x=>x.id===id); if(c){ c.saldo = corrente.saldo; disegnaLista(); }
    disegnaTesta();
    const primo = r.length ? new Date(r[r.length-1].creato) : null;
    $("#d-since").textContent = primo ? "Cliente dal " + primo.toLocaleDateString("it-IT",{day:"numeric",month:"long",year:"numeric"}) : "";
    if(!r.length){ $("#mv").innerHTML = `<div class="empty"><b>Nessun movimento</b>Usa Segna per la prima consumazione</div>`; return; }
    let html = "", last = "";
    for(const m of r){
      const d = new Date(m.creato), g = giorno(d);
      if(g!==last){ html += `<div class="day">${g}</div>`; last = g; }
      const deb = m.tipo==="debito";
      const titolo = deb ? (m.nota || "Consumazione") : (m.nota==="saldo" ? "Saldato" : m.nota ? "Pagato, " + m.nota : "Pagato");
      html += `<div class="mv ${m.annullato?"off":""}">
        <span class="dot ${deb?"debt":"paid"}">${deb?ICON.plus:ICON.minus}</span>
        <span class="nm"><b>${esc(titolo)}</b><small>${ora(d)}${m.annullato?", annullato":""}</small></span>
        <span class="v ${deb?"debt":"paid"}">${deb?"+":"−"}${fmt(m.importo)}</span>
        <button class="x" data-id="${m.id}" data-off="${m.annullato}" aria-label="${m.annullato?"Ripristina":"Annulla"}">${m.annullato?ICON.undo:ICON.x}</button>
      </div>`;
    }
    $("#mv").innerHTML = html;
  }catch(e){ offline(); }
}

$("#mv").onclick = e => {
  const b = e.target.closest(".x"); if(!b) return;
  const riattiva = b.dataset.off==="true";
  const fai = async () => {
    try{
      const r = await rpc("annulla_movimento",{p_id:b.dataset.id,p_annullato:!riattiva});
      if(r===null) return esci();
      chiudi(); toast(riattiva ? "Ripristinato" : "Annullato");
      await caricaMovimenti();
    }catch(err){ offline(); }
  };
  if(riattiva) return fai();
  foglio(`<h3>Annullare il movimento?</h3>
    <p style="color:var(--nebbia);margin:-6px 0 18px">Resta nello storico, barrato, e non conta nel saldo.</p>
    <div class="pair"><button class="btn s" data-x>Indietro</button><button class="btn r" data-ok>Annulla movimento</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudi;
      el.querySelector("[data-ok]").onclick = ev => { ev.currentTarget.disabled = true; fai(); };
  });
};

$("#btn-back").onclick = () => { vista("home"); carica(); };
$("#btn-debt").onclick = () => foglioImporto("debito");
$("#btn-pay").onclick = () => foglioImporto("pagamento");
$("#btn-all").onclick = () => {
  const s = corrente.saldo; if(!(s>0.004)) return;
  foglio(`<h3>Salda il conto di ${esc(corrente.nome)}</h3>
    <div class="confirm"><div class="v">${big(s)}</div></div>
    <div class="pair"><button class="btn s" data-x>Indietro</button><button class="btn g" data-ok>Salda</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudi;
      el.querySelector("[data-ok]").onclick = async ev => { ev.currentTarget.disabled = true; await registra("pagamento", Math.round(s*100)/100, "saldo"); };
  });
};
$("#btn-cmenu").onclick = () => foglio(`
  <div class="menu">
    <button data-a="nome"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>Rinomina</button>
    <button data-a="arch" class="red"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="5" rx="1"/><path d="M5 9v10h14V9M10 13h4"/></svg>Archivia cliente</button>
  </div>`, el => {
    el.querySelector("[data-a=nome]").onclick = () => foglioNome("Rinomina", corrente.nome, "Salva", async nome => {
      const r = await rpc("modifica_cliente",{p_cliente:corrente.id,p_nome:nome,p_archiviato:false});
      if(r===null) return esci();
      corrente.nome = nome;
      const c = clienti.find(x=>x.id===corrente.id); if(c) c.nome = nome;
      disegnaTesta(); disegnaLista(); toast("Salvato");
    });
    el.querySelector("[data-a=arch]").onclick = async () => {
      if(Math.abs(corrente.saldo)>0.004){ chiudi(); toast("Salda il conto prima di archiviare", true); return; }
      const r = await rpc("modifica_cliente",{p_cliente:corrente.id,p_nome:corrente.nome,p_archiviato:true});
      if(r===null) return esci();
      const nome = corrente.nome;
      chiudi(); corrente = null; $("#detail").classList.add("none");
      vista("home"); await carica(); toast("Archiviato " + nome);
    };
  });

async function registra(tipo, importo, nota){
  try{
    const r = await rpc("nuovo_movimento",{p_cliente:corrente.id,p_tipo:tipo,p_importo:importo,p_nota:nota||null});
    if(!r) return esci();
    chiudi();
    toast(tipo==="debito" ? "Segnato " + eur(importo) : nota==="saldo" ? "Saldato " + eur(importo) : "Pagato " + eur(importo));
    await caricaMovimenti();
  }catch(e){ offline(); document.querySelectorAll(".sheet button").forEach(b=>b.disabled=false); }
}

/* ---------- fogli ---------- */
function foglio(html, bind){
  chiudi();
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="grip"></div>${html}</div>`;
  v.onclick = e => { if(e.target===v) chiudi(); };
  $("#sheet-root").appendChild(v);
  bind && bind(v);
}
function chiudi(){ $("#sheet-root").innerHTML = ""; }
addEventListener("keydown", e => { if(e.key==="Escape") chiudi(); });

function leggi(v){
  const n = parseFloat(String(v).replace(/\s/g,"").replace(",","."));
  return isFinite(n) && n>0 ? Math.round(n*100)/100 : null;
}

function foglioImporto(tipo){
  const d = tipo==="debito";
  const quick = d ? [1.2,1.5,2,5] : [5,10,20,50];
  foglio(`<h3>${d?"Segna a":"Pagamento di"} ${esc(corrente.nome)}</h3>
    <div class="amount"><span>€</span><input id="f-imp" inputmode="decimal" placeholder="0,00" autocomplete="off" aria-label="Importo"></div>
    <div class="chips">${quick.map(q=>`<button data-v="${q}">+${q.toLocaleString("it-IT",{minimumFractionDigits:q%1?2:0})}</button>`).join("")}</div>
    <input class="field" id="f-nota" placeholder="${d?"Cosa ha preso":"Nota"}" maxlength="200" autocomplete="off">
    <div class="pair"><button class="btn s" data-x>Indietro</button><button class="btn ${d?"r":"g"}" data-ok>${d?"Segna":"Paga"}</button></div>`, el => {
      const imp = el.querySelector("#f-imp");
      el.querySelector(".chips").onclick = e => {
        const v = e.target.closest("button")?.dataset.v; if(!v) return;
        imp.value = fmt(Math.round(((leggi(imp.value)||0) + Number(v))*100)/100);
      };
      el.querySelector("[data-x]").onclick = chiudi;
      const ok = async () => {
        const v = leggi(imp.value);
        if(!v){ const a = el.querySelector(".amount"); a.classList.remove("shake"); void a.offsetWidth; a.classList.add("shake"); imp.focus(); return; }
        el.querySelector("[data-ok]").disabled = true;
        await registra(tipo, v, el.querySelector("#f-nota").value.trim());
      };
      el.querySelector("[data-ok]").onclick = ok;
      el.querySelectorAll("input").forEach(i => i.onkeydown = e => { if(e.key==="Enter") ok(); });
      setTimeout(()=>imp.focus(), 80);
  });
}

function foglioNome(titolo, val, azione, onSave){
  foglio(`<h3>${titolo}</h3>
    <input class="field" id="f-nome" placeholder="Nome e cognome" maxlength="80" value="${esc(val)}" autocomplete="off" autocapitalize="words">
    <div class="pair"><button class="btn s" data-x>Indietro</button><button class="btn w" data-ok>${azione}</button></div>`, el => {
      const inp = el.querySelector("#f-nome");
      el.querySelector("[data-x]").onclick = chiudi;
      const ok = async () => {
        const n = inp.value.trim(); if(!n){ inp.focus(); return; }
        if(n.toLowerCase()!==val.toLowerCase() && clienti.some(c=>c.nome.toLowerCase()===n.toLowerCase())
           && !confirm("Esiste già un cliente con questo nome. Continuare?")) return;
        el.querySelector("[data-ok]").disabled = true;
        try{ await onSave(n); chiudi(); }catch(e){ offline(); el.querySelector("[data-ok]").disabled=false; }
      };
      el.querySelector("[data-ok]").onclick = ok;
      inp.onkeydown = e => { if(e.key==="Enter") ok(); };
      setTimeout(()=>inp.focus(), 80);
  });
}

function foglioPin(){
  foglio(`<h3>Cambia PIN</h3>
    <input class="field" id="p1" type="password" inputmode="numeric" placeholder="Nuovo PIN, da 4 a 8 cifre" maxlength="8">
    <input class="field" id="p2" type="password" inputmode="numeric" placeholder="Ripeti il nuovo PIN" maxlength="8">
    <div class="pair"><button class="btn s" data-x>Indietro</button><button class="btn w" data-ok>Salva PIN</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudi;
      el.querySelector("[data-ok]").onclick = async () => {
        const a = el.querySelector("#p1").value, b = el.querySelector("#p2").value;
        if(!/^\d{4,8}$/.test(a)) return toast("Il PIN deve avere da 4 a 8 cifre", true);
        if(a!==b) return toast("I due PIN sono diversi", true);
        try{
          const r = await rpc("cambia_pin",{p_nuovo:a});
          if(r===null) return esci();
          pin = a; try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}
          chiudi(); toast("PIN salvato");
        }catch(e){ offline(); }
      };
      setTimeout(()=>el.querySelector("#p1").focus(), 80);
  });
}

/* ---------- avvio ---------- */
buildPad(); drawDots();
if(pin){ vista("home"); carica(); } else vista("login");
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState==="visible" && pin){ carica(); if(corrente) caricaMovimenti(); }
});
</script>
