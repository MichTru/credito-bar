<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f1a17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Credito</title>
<style>
:root{
  --bg:#f5f1ea; --card:#fffdf9; --ink:#1f1a17; --soft:#7a6f66; --line:#e6ded2;
  --debt:#b3261e; --debt-bg:#fbe9e7; --paid:#2e7d4f; --paid-bg:#e5f3ea;
  --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:inherit}
.hidden{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 32px}

/* testata */
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 16px 10px;max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
header h1{font-size:22px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none}
.icon:active{background:var(--line)}
.icon svg{width:22px;height:22px}

/* login */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:24px;background:var(--ink);color:#fff}
#login h1{font-size:28px;letter-spacing:.5px}
.dots{display:flex;gap:14px;height:16px}
.dots span{width:14px;height:14px;border-radius:50%;border:2px solid #fff6}
.dots span.on{background:#fff;border-color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;background:#ffffff14;font-size:28px;color:#fff}
.pad button:active{background:#ffffff33}
.pad .ghost{background:none;font-size:16px}
#login-msg{min-height:20px;color:#ffb4ab;font-size:15px}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* totale + ricerca */
.total{background:var(--ink);color:#fff;border-radius:var(--r);padding:16px 18px;display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.total small{opacity:.7;font-size:14px}
.total strong{font-size:26px;font-variant-numeric:tabular-nums}
.search{width:100%;padding:13px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--card);margin-bottom:12px;outline:none}
.search:focus{border-color:var(--ink)}
.filters{display:flex;gap:8px;margin-bottom:12px}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}

/* lista */
.list{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.row:last-child{border-bottom:0}
.row:active{background:var(--bg)}
.av{width:40px;height:40px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.row .nm{flex:1;min-width:0}
.row .nm b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .nm small{color:var(--soft);font-size:13px}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.amt.debt{color:var(--debt)}
.amt.paid{color:var(--paid)}
.amt.zero{color:var(--soft);font-weight:500}
.empty{padding:40px 16px;text-align:center;color:var(--soft)}

.fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(20px + env(safe-area-inset-bottom));height:56px;padding:0 22px;border-radius:28px;background:var(--ink);color:#fff;font-weight:600;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px #0003}
.fab svg{width:20px;height:20px}

/* cliente */
.balance{text-align:center;padding:18px 0 22px}
.balance strong{display:block;font-size:44px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.balance small{color:var(--soft)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.btn{height:54px;border-radius:var(--r);font-weight:700;font-size:17px}
.btn.debt{background:var(--debt);color:#fff}
.btn.paid{background:var(--paid);color:#fff}
.btn.line{border:1.5px solid var(--paid);color:var(--paid);width:100%;margin-bottom:22px;height:48px;font-size:16px}
.btn.dark{background:var(--ink);color:#fff;width:100%}
.btn:active{opacity:.85}
.btn:disabled{opacity:.4}
h2{font-size:14px;text-transform:uppercase;letter-spacing:.8px;color:var(--soft);margin:0 4px 8px;font-weight:600}
.mv{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.mv .tag{width:8px;height:8px;border-radius:50%;flex:none}
.mv .tag.debt{background:var(--debt)}
.mv .tag.paid{background:var(--paid)}
.mv .nm{flex:1;min-width:0}
.mv .nm b{display:block;font-weight:500}
.mv .nm small{color:var(--soft);font-size:13px}
.mv.off .nm,.mv.off .amt{text-decoration:line-through;opacity:.45}
.mv .undo{font-size:13px;color:var(--soft);padding:6px 8px;border-radius:8px;border:1px solid var(--line)}

/* foglio */
.sheet-bg{position:fixed;inset:0;background:#0006;z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.sheet h3{font-size:19px;margin-bottom:14px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@keyframes fade{from{opacity:0}}
.field{width:100%;padding:14px 16px;border-radius:var(--r);border:1.5px solid var(--line);background:var(--bg);margin-bottom:12px;outline:none}
.field:focus{border-color:var(--ink)}
.field.big{font-size:34px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.quick{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.quick button{flex:1;min-width:60px;padding:10px 0;border-radius:10px;background:var(--bg);border:1px solid var(--line);font-weight:600}
.quick button:active{background:var(--line)}
.sheet .row2{display:flex;gap:10px;margin-top:4px}
.sheet .row2 .btn{flex:1}
.btn.ghost{background:var(--bg);border:1px solid var(--line)}
.btn.warn{color:var(--debt);background:var(--debt-bg)}
.menu button{display:block;width:100%;text-align:left;padding:15px 4px;border-bottom:1px solid var(--line);font-size:17px}
.menu button:last-child{border-bottom:0}
.menu .red{color:var(--debt)}

.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;z-index:30;font-size:15px;max-width:90%;text-align:center;animation:fade .2s}
.loading{padding:40px;text-align:center;color:var(--soft)}
</style>
</head>
<body>

<!-- accesso -->
<section id="login">
  <h1>Credito</h1>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="login-msg"></div>
</section>

<!-- elenco -->
<section id="home" class="hidden">
  <header>
    <h1>Credito</h1>
    <button class="icon" id="btn-refresh" aria-label="Aggiorna"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    <button class="icon" id="btn-settings" aria-label="Impostazioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>
  <div class="wrap">
    <div class="total"><small>Totale da incassare</small><strong id="tot">€ 0,00</strong></div>
    <input class="search" id="q" type="search" placeholder="Cerca cliente" autocomplete="off">
    <div class="filters">
      <button class="chip on" data-f="aperti">Con debito</button>
      <button class="chip" data-f="tutti">Tutti</button>
    </div>
    <div class="list" id="list"><div class="loading">Caricamento…</div></div>
  </div>
  <button class="fab" id="btn-new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Cliente</button>
</section>

<!-- cliente -->
<section id="detail" class="hidden">
  <header>
    <button class="icon" id="btn-back" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
    <h1 id="d-name"></h1>
    <button class="icon" id="btn-cmenu" aria-label="Opzioni"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/></svg></button>
  </header>
  <div class="wrap">
    <div class="balance"><strong id="d-bal">€ 0,00</strong><small id="d-sub"></small></div>
    <div class="actions">
      <button class="btn debt" id="btn-debt">Segna</button>
      <button class="btn paid" id="btn-pay">Paga</button>
    </div>
    <button class="btn line" id="btn-all">Salda tutto</button>
    <h2>Movimenti</h2>
    <div class="list" id="mv"></div>
  </div>
</section>

<div id="sheet-root"></div>

<script>
const SB_URL = "https://fgluxtcxukljiuiayaoh.supabase.co";
const SB_KEY = "sb_publishable_F7SOqYxwlm4-RuP5CHvHCQ_ROFRDYQx";
const PIN_KEY = "credito_pin";

let pin = null;
try { pin = localStorage.getItem(PIN_KEY); } catch(e) {}
let clienti = [];
let filtro = "aperti";
let corrente = null;

const $ = s => document.querySelector(s);
const eur = n => "€ " + Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iniziali = n => n.trim().split(/\s+/).slice(0,2).map(p=>p[0]).join("").toUpperCase();

function quando(iso){
  if(!iso) return "";
  const d = new Date(iso), oggi = new Date();
  const ore = d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});
  const g = new Date(oggi.getFullYear(),oggi.getMonth(),oggi.getDate());
  const gd = new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const diff = Math.round((g-gd)/864e5);
  if(diff===0) return "oggi " + ore;
  if(diff===1) return "ieri " + ore;
  const opt = {day:"numeric",month:"short"};
  if(d.getFullYear()!==oggi.getFullYear()) opt.year="numeric";
  return d.toLocaleDateString("it-IT",opt) + " " + ore;
}

async function rpc(fn, args = {}){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({p_pin: pin, ...args})
  });
  if(!r.ok) throw new Error((await r.text()) || r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

function toast(msg){
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 2200);
}

function show(id){
  ["login","home","detail"].forEach(s => $("#"+s).classList.toggle("hidden", s!==id));
  window.scrollTo(0,0);
}

function esci(){
  pin = null;
  try { localStorage.removeItem(PIN_KEY); } catch(e) {}
  chiudiSheet();
  show("login"); resetPad();
}

/* ---------- accesso ---------- */
let digits = "";
function resetPad(){ digits=""; drawDots(); }
function drawDots(){
  $("#dots").innerHTML = Array.from({length:Math.max(4,digits.length)},(_,i)=>`<span class="${i<digits.length?"on":""}"></span>`).join("");
}
function buildPad(){
  const keys = ["1","2","3","4","5","6","7","8","9","del","0","ok"];
  $("#pad").innerHTML = keys.map(k => k==="del" ? `<button class="ghost" data-k="del">Canc</button>`
    : k==="ok" ? `<button class="ghost" data-k="ok">OK</button>` : `<button data-k="${k}">${k}</button>`).join("");
  $("#pad").onclick = e => {
    const k = e.target.closest("button")?.dataset.k; if(!k) return;
    $("#login-msg").textContent = "";
    if(k==="del") digits = digits.slice(0,-1);
    else if(k==="ok") { if(digits.length>=4) prova(); return; }
    else if(digits.length<8) digits += k;
    drawDots();
  };
}
async function prova(){
  pin = digits;
  try{
    const r = await rpc("accedi");
    if(r==="ok"){
      try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}
      show("home"); carica();
    } else {
      pin = null;
      $("#login-msg").textContent = r==="bloccato" ? "Troppi tentativi, riprova tra 10 minuti" : "PIN errato";
      $("#dots").classList.remove("shake"); void $("#dots").offsetWidth; $("#dots").classList.add("shake");
      resetPad();
    }
  }catch(e){ pin=null; $("#login-msg").textContent = "Connessione assente"; resetPad(); }
}

/* ---------- elenco ---------- */
async function carica(){
  try{
    const r = await rpc("elenco_clienti");
    if(!Array.isArray(r)) return esci();
    clienti = r.map(c => ({...c, saldo:Number(c.saldo)}));
    disegnaLista();
  }catch(e){ toast("Connessione assente"); }
}

function disegnaLista(){
  const tot = clienti.reduce((s,c)=>s+Math.max(0,c.saldo),0);
  $("#tot").textContent = eur(tot);
  const q = $("#q").value.trim().toLowerCase();
  let l = clienti.filter(c => c.nome.toLowerCase().includes(q));
  if(filtro==="aperti" && !q) l = l.filter(c => Math.abs(c.saldo) >= 0.005);
  if(!l.length){
    $("#list").innerHTML = `<div class="empty">${q ? "Nessun cliente trovato" : filtro==="aperti" ? "Nessun debito aperto" : "Nessun cliente"}</div>`;
    return;
  }
  $("#list").innerHTML = l.map(c => {
    const cls = c.saldo>0.004 ? "debt" : c.saldo<-0.004 ? "paid" : "zero";
    return `<button class="row" data-id="${c.id}">
      <span class="av">${esc(iniziali(c.nome))}</span>
      <span class="nm"><b>${esc(c.nome)}</b><small>${c.ultimo ? quando(c.ultimo) : "—"}</small></span>
      <span class="amt ${cls}">${c.saldo<-0.004 ? "+ " + eur(-c.saldo) : eur(c.saldo)}</span>
    </button>`;
  }).join("");
}

$("#list").onclick = e => { const id = e.target.closest(".row")?.dataset.id; if(id) apri(id); };
$("#q").oninput = disegnaLista;
document.querySelectorAll(".chip").forEach(b => b.onclick = () => {
  filtro = b.dataset.f;
  document.querySelectorAll(".chip").forEach(x => x.classList.toggle("on", x===b));
  disegnaLista();
});
$("#btn-refresh").onclick = carica;
$("#btn-new").onclick = () => sheetNome("Nuovo cliente", "", async nome => {
  const id = await rpc("nuovo_cliente",{p_nome:nome});
  if(!id) return esci();
  await carica(); apri(id);
});
$("#btn-settings").onclick = () => sheet(`
  <div class="menu">
    <button data-a="pin">Cambia PIN</button>
    <button data-a="esci" class="red">Esci da questo dispositivo</button>
  </div>`, el => {
    el.querySelector("[data-a=pin]").onclick = sheetPin;
    el.querySelector("[data-a=esci]").onclick = esci;
  });

/* ---------- cliente ---------- */
async function apri(id){
  corrente = clienti.find(c => c.id===id) || {id, nome:"", saldo:0};
  $("#d-name").textContent = corrente.nome;
  $("#mv").innerHTML = `<div class="loading">Caricamento…</div>`;
  disegnaSaldo();
  show("detail");
  await caricaMovimenti();
}

function disegnaSaldo(){
  const s = corrente.saldo;
  const el = $("#d-bal");
  el.textContent = s<-0.004 ? "+ " + eur(-s) : eur(s);
  el.style.color = s>0.004 ? "var(--debt)" : s<-0.004 ? "var(--paid)" : "var(--ink)";
  $("#d-sub").textContent = s>0.004 ? "da pagare" : s<-0.004 ? "a credito" : "in pari";
  $("#btn-all").disabled = !(s>0.004);
  $("#btn-all").textContent = s>0.004 ? "Salda tutto · " + eur(s) : "Salda tutto";
}

async function caricaMovimenti(){
  try{
    const r = await rpc("movimenti_cliente",{p_cliente:corrente.id});
    if(!Array.isArray(r)) return esci();
    corrente.saldo = r.filter(m=>!m.annullato).reduce((s,m)=>s+(m.tipo==="debito"?1:-1)*Number(m.importo),0);
    const c = clienti.find(x=>x.id===corrente.id); if(c) c.saldo = corrente.saldo;
    disegnaSaldo();
    if(!r.length){ $("#mv").innerHTML = `<div class="empty">Nessun movimento</div>`; return; }
    $("#mv").innerHTML = r.map(m => {
      const d = m.tipo==="debito";
      return `<div class="mv ${m.annullato?"off":""}">
        <span class="tag ${d?"debt":"paid"}"></span>
        <span class="nm"><b>${d ? esc(m.nota || "Consumazione") : (m.nota ? "Pagato · " + esc(m.nota) : "Pagato")}</b><small>${quando(m.creato)}</small></span>
        <span class="amt ${d?"debt":"paid"}">${d?"":"− "}${eur(m.importo)}</span>
        <button class="undo" data-id="${m.id}" data-off="${m.annullato}">${m.annullato?"Ripristina":"Annulla"}</button>
      </div>`;
    }).join("");
  }catch(e){ toast("Connessione assente"); }
}

$("#mv").onclick = async e => {
  const b = e.target.closest(".undo"); if(!b) return;
  const riattiva = b.dataset.off==="true";
  if(!riattiva && !confirm("Annullare questo movimento?")) return;
  b.disabled = true;
  try{
    const r = await rpc("annulla_movimento",{p_id:b.dataset.id,p_annullato:!riattiva});
    if(r===null) return esci();
    await caricaMovimenti();
  }catch(err){ toast("Connessione assente"); b.disabled=false; }
};

$("#btn-back").onclick = () => { show("home"); disegnaLista(); carica(); };
$("#btn-debt").onclick = () => sheetImporto("debito");
$("#btn-pay").onclick = () => sheetImporto("pagamento");
$("#btn-all").onclick = () => {
  const s = corrente.saldo; if(!(s>0.004)) return;
  sheet(`<h3>Salda ${esc(corrente.nome)}</h3>
    <div class="balance" style="padding:4px 0 18px"><strong style="color:var(--paid)">${eur(s)}</strong></div>
    <div class="row2"><button class="btn ghost" data-x>Indietro</button><button class="btn paid" data-ok>Conferma</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudiSheet;
      el.querySelector("[data-ok]").onclick = async ev => {
        ev.target.disabled = true;
        await registra("pagamento", Math.round(s*100)/100, "saldo");
      };
  });
};
$("#btn-cmenu").onclick = () => sheet(`
  <div class="menu">
    <button data-a="nome">Rinomina</button>
    <button data-a="arch" class="red">Archivia cliente</button>
  </div>`, el => {
    el.querySelector("[data-a=nome]").onclick = () => sheetNome("Rinomina", corrente.nome, async nome => {
      const r = await rpc("modifica_cliente",{p_cliente:corrente.id,p_nome:nome,p_archiviato:false});
      if(r===null) return esci();
      corrente.nome = nome; $("#d-name").textContent = nome;
      const c = clienti.find(x=>x.id===corrente.id); if(c) c.nome = nome;
    });
    el.querySelector("[data-a=arch]").onclick = async () => {
      if(Math.abs(corrente.saldo)>0.004){ toast("Prima va saldato il conto"); return; }
      if(!confirm("Archiviare " + corrente.nome + "?")) return;
      const r = await rpc("modifica_cliente",{p_cliente:corrente.id,p_nome:corrente.nome,p_archiviato:true});
      if(r===null) return esci();
      chiudiSheet(); show("home"); carica();
    };
  });

async function registra(tipo, importo, nota){
  try{
    const r = await rpc("nuovo_movimento",{p_cliente:corrente.id,p_tipo:tipo,p_importo:importo,p_nota:nota||null});
    if(!r) return esci();
    chiudiSheet();
    toast(tipo==="debito" ? "Segnato " + eur(importo) : "Pagato " + eur(importo));
    await caricaMovimenti();
  }catch(e){ toast("Non salvato, riprova"); document.querySelectorAll(".sheet button").forEach(b=>b.disabled=false); }
}

/* ---------- fogli ---------- */
function sheet(html, bind){
  chiudiSheet();
  const bg = document.createElement("div");
  bg.className = "sheet-bg";
  bg.innerHTML = `<div class="sheet">${html}</div>`;
  bg.onclick = e => { if(e.target===bg) chiudiSheet(); };
  $("#sheet-root").appendChild(bg);
  bind && bind(bg);
  return bg;
}
function chiudiSheet(){ $("#sheet-root").innerHTML = ""; }

function leggiImporto(v){
  const n = parseFloat(String(v).replace(/\s/g,"").replace(",","."));
  return isFinite(n) && n>0 ? Math.round(n*100)/100 : null;
}

function sheetImporto(tipo){
  const d = tipo==="debito";
  const quick = d ? [1.2,1.5,2,5,10] : [5,10,20,50];
  const el = sheet(`<h3>${d?"Segna a":"Pagamento di"} ${esc(corrente.nome)}</h3>
    <input class="field big" id="f-imp" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <div class="quick">${quick.map(q=>`<button data-v="${q}">${q.toLocaleString("it-IT",{minimumFractionDigits:q%1?2:0})}</button>`).join("")}</div>
    <input class="field" id="f-nota" placeholder="${d?"Cosa (facoltativo)":"Nota (facoltativa)"}" maxlength="200" autocomplete="off">
    <div class="row2"><button class="btn ghost" data-x>Annulla</button><button class="btn ${d?"debt":"paid"}" data-ok>${d?"Segna":"Registra"}</button></div>`, el => {
      const imp = el.querySelector("#f-imp");
      el.querySelector(".quick").onclick = e => {
        const v = e.target.closest("button")?.dataset.v; if(!v) return;
        const cur = leggiImporto(imp.value) || 0;
        imp.value = (Math.round((cur + Number(v))*100)/100).toLocaleString("it-IT",{minimumFractionDigits:2});
      };
      el.querySelector("[data-x]").onclick = chiudiSheet;
      const ok = async () => {
        const v = leggiImporto(imp.value);
        if(!v){ imp.classList.remove("shake"); void imp.offsetWidth; imp.classList.add("shake"); imp.focus(); return; }
        el.querySelector("[data-ok]").disabled = true;
        await registra(tipo, v, el.querySelector("#f-nota").value.trim());
      };
      el.querySelector("[data-ok]").onclick = ok;
      el.querySelectorAll("input").forEach(i => i.onkeydown = e => { if(e.key==="Enter") ok(); });
      setTimeout(()=>imp.focus(), 60);
  });
}

function sheetNome(titolo, val, onSave){
  sheet(`<h3>${titolo}</h3>
    <input class="field" id="f-nome" placeholder="Nome" maxlength="80" value="${esc(val)}" autocomplete="off" autocapitalize="words">
    <div class="row2"><button class="btn ghost" data-x>Annulla</button><button class="btn dark" data-ok>Salva</button></div>`, el => {
      const inp = el.querySelector("#f-nome");
      el.querySelector("[data-x]").onclick = chiudiSheet;
      const ok = async () => {
        const n = inp.value.trim(); if(!n){ inp.focus(); return; }
        if(n.toLowerCase()!==val.toLowerCase() && clienti.some(c=>c.nome.toLowerCase()===n.toLowerCase())
           && !confirm("Esiste già un cliente con questo nome. Continuare?")) return;
        el.querySelector("[data-ok]").disabled = true;
        try{ await onSave(n); chiudiSheet(); }catch(e){ toast("Non salvato, riprova"); el.querySelector("[data-ok]").disabled=false; }
      };
      el.querySelector("[data-ok]").onclick = ok;
      inp.onkeydown = e => { if(e.key==="Enter") ok(); };
      setTimeout(()=>inp.focus(), 60);
  });
}

function sheetPin(){
  sheet(`<h3>Cambia PIN</h3>
    <input class="field" id="p1" type="password" inputmode="numeric" placeholder="Nuovo PIN (4–8 cifre)" maxlength="8">
    <input class="field" id="p2" type="password" inputmode="numeric" placeholder="Ripeti nuovo PIN" maxlength="8">
    <div class="row2"><button class="btn ghost" data-x>Annulla</button><button class="btn dark" data-ok>Salva</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudiSheet;
      el.querySelector("[data-ok]").onclick = async () => {
        const a = el.querySelector("#p1").value, b = el.querySelector("#p2").value;
        if(!/^\d{4,8}$/.test(a)) return toast("Il PIN deve avere da 4 a 8 cifre");
        if(a!==b) return toast("I PIN non coincidono");
        try{
          const r = await rpc("cambia_pin",{p_nuovo:a});
          if(r===null) return esci();
          pin = a; try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}
          chiudiSheet(); toast("PIN aggiornato");
        }catch(e){ toast("Non salvato, riprova"); }
      };
  });
}
