<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c42b2a">
<link rel="icon" href="favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Credito">
<title>Credito · Bar Stuoie</title>
<style>
:root{
  --fondo:#0c1534; --pannello:#16224d; --pannello-2:#22306a; --riga:#ffffff1c;
  --bianco:#ffffff; --grigio:#c3cbe6;
  --rosso:#e0352d; --rosso-chiaro:#ff8a83; --verde:#20a464; --verde-chiaro:#5fe0a0; --blu:#2f5fd8;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --safe-b:env(safe-area-inset-bottom); --safe-t:env(safe-area-inset-top);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:var(--fondo);-webkit-text-size-adjust:100%}
body{font:400 18px/1.4 var(--font);color:var(--bianco);background:var(--fondo);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input{font:inherit;color:inherit;border:0;background:none}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:12px}
.hidden{display:none!important}
.tab{font-variant-numeric:tabular-nums}

.sky{position:relative;isolation:isolate}
.sky::before{content:"";position:absolute;inset:0 0 auto;height:420px;z-index:-1;pointer-events:none;
  background:
    radial-gradient(75% 60% at 0% 0%,#e8433a 0%,#c42b2a 30%,transparent 72%),
    radial-gradient(80% 65% at 100% 8%,#3567e0 0%,#1f3f9e 35%,transparent 75%),
    linear-gradient(180deg,transparent 0%,#14245a 62%,var(--fondo) 100%)}

/* intro: lo stemma si disegna */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:#0b1433;overflow:hidden;cursor:pointer}
#intro .bg{position:absolute;inset:0;background:linear-gradient(112deg,#e23d34 0%,#b8242a 44%,#1d3a96 56%,#0e1d52 100%);opacity:0;animation:in .7s 1.25s ease-out forwards}
#intro .stage{position:relative;width:160px;aspect-ratio:360/490}
#intro svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#intro .ln{fill:none;stroke:#fff;stroke-width:7;stroke-linejoin:round;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;
  filter:drop-shadow(0 0 10px #ffffffaa);animation:draw 1.3s cubic-bezier(.65,0,.35,1) .15s forwards,lnout .5s 1.5s forwards}
#intro .fill{fill:#ffffff;opacity:0;animation:flash .7s 1.3s ease-out forwards}
#intro img{position:absolute;inset:0;width:100%;height:100%;opacity:0;transform:scale(.96);filter:drop-shadow(0 20px 36px #0008);animation:logo .6s 1.3s cubic-bezier(.2,.9,.3,1.1) forwards}
#intro .word{position:relative;text-align:center;opacity:0;animation:rise .6s 1.6s ease-out forwards}
#intro .word b{display:block;font-size:32px;font-weight:700;letter-spacing:-.02em}
#intro .word span{color:#ffffffcc;font-size:18px}
#intro.out{animation:out .55s cubic-bezier(.6,0,.3,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes lnout{to{opacity:0}}
@keyframes flash{30%{opacity:.55}to{opacity:0}}
@keyframes logo{to{opacity:1;transform:none}}
@keyframes in{to{opacity:1}}
@keyframes rise{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes out{to{transform:translateY(-100%);border-radius:0 0 40px 40px}}

/* accesso */
#login{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b))}
#login img{width:90px}
#login h1{font-size:30px;font-weight:700;margin-top:16px}
#login p{font-size:20px;margin-top:4px}
.dots{display:flex;gap:18px;height:18px;margin:28px 0 30px}
.dots span{width:18px;height:18px;border-radius:50%;border:2px solid #ffffffaa}
.dots span.on{background:#fff;border-color:#fff}
.pad{display:grid;grid-template-columns:repeat(3,84px);gap:14px 22px}
.pad button{height:84px;border-radius:50%;font-size:34px;font-weight:500;background:#ffffff22;border:1px solid #ffffff33}
.pad button:active{background:#ffffff55}
.pad .t{background:none;border:0;font-size:18px;font-weight:600}
#login-msg{min-height:28px;margin-top:20px;font-size:20px;font-weight:600;color:#ffd0cd;text-align:center}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}

/* struttura */
#app{max-width:1180px;margin:0 auto}
.pane{min-height:100vh;padding:var(--safe-t) 0 calc(112px + var(--safe-b))}
.top{display:flex;align-items:center;gap:12px;padding:14px 18px}
.top img{width:40px}
.top .ttl{flex:1;font-size:22px;font-weight:700}
.link{height:46px;padding:0 16px;border-radius:23px;background:#ffffff26;border:1px solid #ffffff40;font-size:17px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.link:active{background:#ffffff4d}
.link svg{width:20px;height:20px}

.total{padding:6px 20px 4px}
.total small{display:block;font-size:18px;color:#ffffffd9}
.total b{display:block;font-size:54px;font-weight:800;letter-spacing:-.035em;line-height:1.1;text-shadow:0 6px 24px #0004}
.total b span{opacity:.6}

.search{margin:18px 16px 0;display:flex;align-items:center;gap:12px;height:62px;padding:0 18px;border-radius:22px;background:#fff;color:#0c1534;box-shadow:0 14px 34px #0a102f55}
.search svg{width:24px;height:24px;flex:none;color:#55607f}
.search input{flex:1;min-width:0;outline:none;height:100%;font-size:20px}
.search input::placeholder{color:#6b7594}
.search .clr{width:36px;height:36px;border-radius:50%;background:#e4e8f3;display:grid;place-items:center}
.search .clr svg{width:18px;height:18px}

.list{margin:16px 16px 0;background:linear-gradient(180deg,#18265a,var(--pannello));border-radius:26px;overflow:hidden;border:1px solid #ffffff12;box-shadow:0 20px 40px #0003}
.av{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;font-weight:700;font-size:17px;background:#2f5fd833;color:#9dbbff}
.cl.debt .av{background:#e0352d2e;color:var(--rosso-chiaro)}
.cl.paid .av{background:#20a46433;color:var(--verde-chiaro)}
.cl{display:flex;align-items:center;gap:14px;width:100%;min-height:76px;padding:12px 18px;text-align:left;border-top:1px solid var(--riga)}
.cl:first-child{border-top:0}
.cl:active,.cl.sel{background:var(--pannello-2)}
.cl .nm{flex:1;min-width:0;font-size:20px;font-weight:600;overflow-wrap:anywhere}
.cl .v{text-align:right;flex:none}
.cl .v b{display:block;font-size:21px;font-weight:700}
.cl .v small{display:block;font-size:15px;color:var(--grigio)}
.cl.debt .v b{color:var(--rosso-chiaro)}
.cl.paid .v b{color:var(--verde-chiaro)}
.cl.zero .v b{color:var(--grigio);font-weight:500}
.cl .arr{width:22px;height:22px;color:var(--grigio);flex:none}
.empty{padding:36px 22px;text-align:center;font-size:19px;color:var(--grigio)}
.empty b{display:block;color:#fff;font-size:21px;margin-bottom:6px}
.loading{padding:36px;text-align:center;color:var(--grigio)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:6;padding:12px 16px calc(12px + var(--safe-b));background:linear-gradient(transparent,var(--fondo) 30%)}
.big{width:100%;max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:center;gap:12px;min-height:66px;padding:10px 20px;border-radius:20px;
  font-size:21px;font-weight:700;color:#fff;text-align:center}
.big svg{width:26px;height:26px;flex:none}
.big:active{transform:scale(.98);filter:brightness(1.1)}
.big:disabled{opacity:.35;transform:none}
.big.blu{background:linear-gradient(180deg,#4b7cf0,#2a55c8);box-shadow:0 12px 26px #2a55c855,inset 0 1px 0 #ffffff40}
.big.rosso{background:linear-gradient(180deg,#f0544b,#cc2a23);box-shadow:0 12px 26px #cc2a2355,inset 0 1px 0 #ffffff40}
.big.verde{background:linear-gradient(180deg,#2fbf79,#1b9157);box-shadow:0 12px 26px #1b915755,inset 0 1px 0 #ffffff40}
.big.vuoto{background:transparent;border:2px solid #ffffff55}
.big.grigio{background:linear-gradient(180deg,#2a397a,#202d66);box-shadow:inset 0 1px 0 #ffffff1f}

/* cliente */
.back{height:50px;padding:0 18px 0 10px;border-radius:25px;background:#ffffff26;border:1px solid #ffffff40;font-size:19px;font-weight:600;display:inline-flex;align-items:center;gap:4px}
.back svg{width:24px;height:24px}
.back:active{background:#ffffff4d}
.ccard{margin:10px 16px 0;padding:22px;border-radius:28px;position:relative;overflow:hidden;isolation:isolate;
  background:linear-gradient(150deg,#ffffff5c 0%,#ffffff22 50%,#ffffff10 100%);border:1px solid #ffffff5c;
  backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:0 24px 50px #0a183f66}
.ccard::before{content:"";position:absolute;inset:-30%;z-index:-1;filter:blur(8px);
  background:radial-gradient(40% 35% at 25% 75%,#e2443c 0%,transparent 70%),radial-gradient(40% 35% at 80% 70%,#2a5bdc 0%,transparent 70%),radial-gradient(35% 30% at 40% 15%,#ffffff99 0%,transparent 70%)}
.ccard::after{content:"";position:absolute;inset:0;z-index:-1;background:#0c153433}
.ccard img{position:absolute;right:18px;top:18px;width:44px}
.ccard h2{font-size:30px;font-weight:700;line-height:1.15;padding-right:56px;overflow-wrap:anywhere}
.ccard .lab{display:inline-block;font-size:17px;margin-top:22px;font-weight:700;padding:6px 12px;border-radius:99px;background:#ffffff2e}
.ccard .bal{font-size:60px;font-weight:800;letter-spacing:-.035em;line-height:1.05;margin-top:8px;text-shadow:0 6px 24px #0003}
.ccard.debt .lab{background:#e0352dcc;color:#fff}
.ccard.paid .lab{background:#1b9157d9;color:#fff}
.acts{display:grid;gap:12px;padding:18px 16px 0}
.sec{font-size:21px;font-weight:700;padding:30px 20px 12px}
.mvs{margin:0 16px;background:linear-gradient(180deg,#18265a,var(--pannello));border-radius:26px;overflow:hidden;border:1px solid #ffffff12}
.day{font-size:16px;font-weight:700;color:var(--grigio);padding:16px 18px 6px;background:#ffffff08}
.mv{display:flex;align-items:center;gap:12px;padding:14px 18px;border-top:1px solid var(--riga)}
.day+.mv{border-top:0}
.mv .nm{flex:1;min-width:0}
.mv .nm b{display:block;font-size:19px;font-weight:600;overflow-wrap:anywhere}
.mv .nm small{font-size:16px;color:var(--grigio)}
.mv .v{font-size:20px;font-weight:700;white-space:nowrap}
.mv .v.debt{color:var(--rosso-chiaro)}
.mv .v.paid{color:var(--verde-chiaro)}
.mv.off .nm b,.mv.off .v{text-decoration:line-through;opacity:.5}
.mv .x{height:40px;padding:0 12px;border-radius:12px;border:1.5px solid #ffffff40;font-size:15px;font-weight:600;flex:none}
.mv .x:active{background:#ffffff22}
.tools{padding:28px 16px 0}
.blank{display:none}

/* fogli */
.veil{position:fixed;inset:0;z-index:20;background:#040919b3;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;animation:fade .16s}
.sheet{width:100%;max-width:560px;max-height:100%;overflow-y:auto;background:linear-gradient(180deg,#1d2b62,var(--pannello) 40%);border:1px solid #ffffff14;border-bottom:0;border-radius:30px 30px 0 0;padding:20px 16px calc(16px + var(--safe-b));animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet h3{font-size:24px;font-weight:700;line-height:1.2;margin-bottom:6px}
.sheet p{font-size:19px;color:var(--grigio);margin-bottom:16px}
.display{display:flex;align-items:baseline;justify-content:center;gap:6px;min-height:88px;margin:8px 0 10px;border-radius:22px;background:#0a1230;border:1px solid #ffffff12;padding:8px}
.display span{font-size:34px;font-weight:600;color:var(--grigio)}
.display b{font-size:58px;font-weight:800;letter-spacing:-.02em}
.display b.ph{color:#ffffff40}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px}
.chips button{height:52px;border-radius:16px;background:#2f5fd833;color:#cfdcff;font-size:19px;font-weight:700}
.chips button:active{background:#33438a}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.keys button{height:62px;border-radius:18px;background:linear-gradient(180deg,#ffffff1c,#ffffff0d);box-shadow:inset 0 1px 0 #ffffff1a;font-size:28px;font-weight:600}
.keys button:active{background:#ffffff40}
.keys svg{width:28px;height:28px}
.field{width:100%;height:60px;padding:0 18px;border-radius:16px;background:#fff;color:#0c1534;font-size:19px;outline:none;margin-bottom:12px}
.field::placeholder{color:#6b7594}
.pair{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.pair .big{min-height:62px}
.stack{display:grid;gap:10px}

/* conferma grande */
.done{position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;padding:24px;background:#040919d9;animation:fade .15s}
.done div{width:100%;max-width:420px;border-radius:28px;padding:30px 24px;text-align:center;background:#fff;color:#0c1534;animation:pop .25s cubic-bezier(.2,.9,.3,1.2)}
.done i{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;background:var(--verde);color:#fff}
.done.err i{background:var(--rosso)}
.done i svg{width:40px;height:40px}
.done b{display:block;font-size:26px;line-height:1.2}
.done span{display:block;font-size:19px;color:#4a5576;margin-top:6px}

@keyframes up{from{transform:translateY(60px);opacity:0}}
@keyframes fade{from{opacity:0}}
@keyframes pop{from{transform:scale(.85);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}

/* tablet: elenco e cliente affiancati */
@media (min-width:900px){
  #app.on{display:grid;grid-template-columns:440px 1fr}
  #app.on #home,#app.on #detail{display:block!important;height:100vh;overflow-y:auto}
  #home{border-right:1px solid var(--riga)}
  .dock{position:sticky;bottom:0}
  #btn-back{visibility:hidden}
  #detail.none>.wrap{display:none}
  #detail.none .blank{display:flex;height:100%;align-items:center;justify-content:center;flex-direction:column;gap:16px;font-size:22px}
  .blank img{width:110px}
  #detail .wrap{max-width:640px;margin:0 auto;padding-bottom:40px}
}
</style>
</head>
<body>

<div id="intro" aria-hidden="true">
  <div class="bg"></div>
  <div class="stage">
    <svg viewBox="0 0 360 490"><path class="fill" d="M180 3 L354 30 L352 300 C350 400 270 450 180 487 C90 450 10 400 8 300 L6 30 Z"/><path class="ln" pathLength="1" d="M180 3 L354 30 L352 300 C350 400 270 450 180 487 C90 450 10 400 8 300 L6 30 Z"/></svg>
    <img src="logo-white.png" alt="">
  </div>
  <div class="word"><b>Bar Stuoie</b><span>Credito</span></div>
</div>

<section id="login" class="sky hidden">
  <img src="logo-white.png" alt="Bar Stuoie">
  <h1>Credito</h1>
  <p>Scrivi il PIN</p>
  <div class="dots" id="dots"></div>
  <div class="pad" id="pad"></div>
  <div id="login-msg"></div>
</section>

<div id="app" class="hidden">
  <section id="home" class="pane sky">
    <div class="top">
      <img src="logo-white.png" alt="">
      <div class="ttl">Bar Stuoie</div>
      <button class="link" id="btn-settings">Impostazioni</button>
    </div>
    <div class="total"><small>Totale da incassare</small><b class="tab" id="tot">€ 0,00</b></div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="search" placeholder="Cerca il nome" autocomplete="off" aria-label="Cerca il nome del cliente">
      <button class="clr hidden" id="q-clr" aria-label="Cancella ricerca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </label>
    <div class="list" id="list"><div class="loading">Caricamento…</div></div>
    <div class="dock"><button class="big blu" id="btn-new"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Aggiungi un cliente</button></div>
  </section>

  <section id="detail" class="pane sky hidden none">
    <div class="wrap">
      <div class="top"><button class="back" id="btn-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Indietro</button></div>
      <div class="ccard" id="ccard">
        <img src="logo-white.png" alt="">
        <h2 id="d-name"></h2>
        <div class="lab" id="d-state"></div>
        <div class="bal tab" id="d-bal"></div>
      </div>
      <div class="acts">
        <button class="big rosso" id="btn-debt"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Aggiungi al conto</button>
        <button class="big verde" id="btn-pay"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M5 12h14"/></svg>Ha pagato una parte</button>
        <button class="big blu" id="btn-all"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span id="all-txt">Ha pagato tutto</span></button>
      </div>
      <div class="sec">Storico</div>
      <div class="mvs" id="mv"></div>
      <div class="tools"><button class="big vuoto" id="btn-edit">Modifica cliente</button></div>
    </div>
    <div class="blank"><img src="logo-white.png" alt=""><span>Tocca un nome nella lista</span></div>
  </section>
</div>

<div id="sheet-root"></div>

<script>
const SB_URL = "https://fgluxtcxukljiuiayaoh.supabase.co";
const SB_KEY = "sb_publishable_F7SOqYxwlm4-RuP5CHvHCQ_ROFRDYQx";
const PIN_KEY = "credito_pin";

let pin = null;
try { pin = localStorage.getItem(PIN_KEY); } catch(e) {}
let clienti = [], corrente = null;

const $ = s => document.querySelector(s);
const wide = () => matchMedia("(min-width:900px)").matches;
const fmt = n => Number(n).toLocaleString("it-IT",{minimumFractionDigits:2,maximumFractionDigits:2});
const eur = n => "€ " + fmt(n);
const iniziali = n => (n.match(/\p{L}+/gu) || ["?"]).slice(0,2).map(p=>p[0]).join("").toUpperCase();
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
const CROSS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
const ARROW = '<svg class="arr" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>';

function giorno(d){
  const oggi = new Date(), g = new Date(oggi.getFullYear(),oggi.getMonth(),oggi.getDate());
  const diff = Math.round((g - new Date(d.getFullYear(),d.getMonth(),d.getDate()))/864e5);
  if(diff===0) return "Oggi";
  if(diff===1) return "Ieri";
  const o = {weekday:"long",day:"numeric",month:"long"};
  if(d.getFullYear()!==oggi.getFullYear()) o.year="numeric";
  const s = d.toLocaleDateString("it-IT",o);
  return s[0].toUpperCase()+s.slice(1);
}
const ora = d => d.toLocaleTimeString("it-IT",{hour:"2-digit",minute:"2-digit"});

async function rpc(fn, args = {}){
  const r = await fetch(`${SB_URL}/rest/v1/rpc/${fn}`, {
    method:"POST", cache:"no-store",
    headers:{"apikey":SB_KEY,"Authorization":"Bearer "+SB_KEY,"Content-Type":"application/json"},
    body: JSON.stringify({p_pin: pin, ...args})
  });
  if(!r.ok) throw new Error((await r.text()) || r.status);
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}

/* conferma grande al centro dello schermo */
function avviso(titolo, sotto, err){
  document.querySelectorAll(".done").forEach(x=>x.remove());
  const d = document.createElement("div");
  d.className = "done" + (err ? " err" : "");
  d.innerHTML = `<div><i>${err?CROSS:CHECK}</i><b>${esc(titolo)}</b>${sotto?`<span>${esc(sotto)}</span>`:""}</div>`;
  d.onclick = () => d.remove();
  document.body.appendChild(d);
  setTimeout(()=>d.remove(), err ? 3500 : 2200);
}
const offline = () => avviso("Non salvato", "Manca la connessione a internet. Riprova.", true);

/* intro: solo all'apertura */
function intro(){
  const el = $("#intro"); let done = false;
  const fine = () => { if(done) return; done = true; el.classList.add("out"); setTimeout(()=>el.remove(), 560); };
  el.onclick = fine;
  setTimeout(fine, matchMedia("(prefers-reduced-motion:reduce)").matches ? 300 : 2800);
}

/* navigazione */
function vista(v){
  $("#login").classList.toggle("hidden", v!=="login");
  $("#app").classList.toggle("hidden", v==="login");
  $("#app").classList.add("on");
  if(v==="login") return;
  if(!wide()){
    $("#home").classList.toggle("hidden", v!=="home");
    $("#detail").classList.toggle("hidden", v!=="detail");
    window.scrollTo(0,0);
  }
}
addEventListener("resize", () => {
  if($("#app").classList.contains("hidden")) return;
  if(wide()){ $("#home").classList.remove("hidden"); $("#detail").classList.remove("hidden"); }
  else vista(corrente && !$("#detail").classList.contains("none") ? "detail" : "home");
});
function esci(){
  pin = null; corrente = null;
  try { localStorage.removeItem(PIN_KEY); } catch(e) {}
  chiudi(); vista("login"); resetPad();
}

/* accesso: PIN di 4 cifre, entra da solo */
let digits = "";
function resetPad(){ digits=""; drawDots(); }
function drawDots(){ $("#dots").innerHTML = [0,1,2,3].map(i=>`<span class="${i<digits.length?"on":""}"></span>`).join(""); }
function tasto(k){
  $("#login-msg").textContent = "";
  if(k==="del") digits = digits.slice(0,-1);
  else if(digits.length<4) digits += k;
  drawDots();
  if(digits.length===4) setTimeout(prova, 120);
}
function buildPad(){
  const keys = ["1","2","3","4","5","6","7","8","9","","0","del"];
  $("#pad").innerHTML = keys.map(k => k==="del" ? `<button class="t" data-k="del">Cancella</button>` : k==="" ? `<span></span>` : `<button data-k="${k}">${k}</button>`).join("");
  $("#pad").onclick = e => { const k = e.target.closest("button")?.dataset.k; if(k) tasto(k); };
  addEventListener("keydown", e => {
    if($("#login").classList.contains("hidden")) return;
    if(/^\d$/.test(e.key)) tasto(e.key); else if(e.key==="Backspace") tasto("del");
  });
}
async function prova(){
  pin = digits;
  try{
    const r = await rpc("accedi");
    if(r==="ok"){
      try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}
      vista("home"); carica();
    } else {
      pin = null;
      $("#login-msg").textContent = r==="bloccato" ? "Troppi tentativi. Aspetta 10 minuti." : "PIN sbagliato. Riprova.";
      const d = $("#dots"); d.classList.remove("shake"); void d.offsetWidth; d.classList.add("shake");
      resetPad();
    }
  }catch(e){ pin=null; $("#login-msg").textContent = "Manca la connessione a internet."; resetPad(); }
}

/* elenco */
async function carica(){
  try{
    const r = await rpc("elenco_clienti");
    if(!Array.isArray(r)) return esci();
    clienti = r.map(c => ({...c, saldo:Number(c.saldo)})).sort((a,b)=>a.nome.localeCompare(b.nome,"it"));
    disegnaLista();
    if(corrente){ const c = clienti.find(x=>x.id===corrente.id); if(c){ corrente = {...corrente, ...c}; disegnaTesta(); } }
  }catch(e){}
}

function disegnaLista(){
  { const [i,d] = fmt(clienti.filter(c=>c.saldo>0.004).reduce((s,c)=>s+c.saldo,0)).split(","); $("#tot").innerHTML = `€ ${i}<span>,${d}</span>`; }
  const q = $("#q").value.trim().toLowerCase();
  $("#q-clr").classList.toggle("hidden", !q);
  const l = clienti.filter(c => c.nome.toLowerCase().includes(q));
  if(!l.length){
    $("#list").innerHTML = q ? `<div class="empty"><b>Nessuno si chiama “${esc(q)}”</b>Controlla il nome o aggiungilo come nuovo cliente.</div>`
      : `<div class="empty"><b>Non ci sono ancora clienti</b>Tocca “Aggiungi un cliente” qui sotto.</div>`;
    return;
  }
  $("#list").innerHTML = l.map(c => {
    const cls = c.saldo>0.004 ? "debt" : c.saldo<-0.004 ? "paid" : "zero";
    const sel = corrente && corrente.id===c.id && wide() ? " sel" : "";
    const v = cls==="debt" ? `<b>${eur(c.saldo)}</b><small>da pagare</small>` : cls==="paid" ? `<b>${eur(-c.saldo)}</b><small>a credito</small>` : `<b>In pari</b>`;
    return `<button class="cl ${cls}${sel}" data-id="${c.id}"><span class="av">${esc(iniziali(c.nome))}</span><span class="nm">${esc(c.nome)}</span><span class="v tab">${v}</span>${ARROW}</button>`;
  }).join("");
}

$("#list").onclick = e => { const id = e.target.closest(".cl")?.dataset.id; if(id) apri(id); };
$("#q").oninput = disegnaLista;
$("#q-clr").onclick = e => { e.preventDefault(); $("#q").value = ""; disegnaLista(); };
$("#btn-new").onclick = () => foglioNome("Aggiungi un cliente", "", "Aggiungi", async nome => {
  const id = await rpc("nuovo_cliente",{p_nome:nome});
  if(!id) return esci();
  $("#q").value = "";
  await carica(); apri(id); avviso("Cliente aggiunto", nome);
});
$("#btn-settings").onclick = () => foglio(`
  <h3>Impostazioni</h3><p>&nbsp;</p>
  <div class="stack">
    <button class="big grigio" data-a="pin">Cambia il PIN</button>
    <button class="big vuoto" data-a="esci">Esci da questo telefono</button>
    <button class="big grigio" data-x>Chiudi</button>
  </div>`, el => {
    el.querySelector("[data-a=pin]").onclick = foglioPin;
    el.querySelector("[data-x]").onclick = chiudi;
    el.querySelector("[data-a=esci]").onclick = () => foglio(`
      <h3>Uscire da questo telefono?</h3><p>Per rientrare servirà il PIN.</p>
      <div class="pair"><button class="big grigio" data-x>No</button><button class="big rosso" data-ok>Sì, esci</button></div>`, e2 => {
        e2.querySelector("[data-x]").onclick = chiudi; e2.querySelector("[data-ok]").onclick = esci; });
  });

/* cliente */
async function apri(id){
  corrente = {...(clienti.find(c => c.id===id) || {id, nome:"", saldo:0})};
  $("#detail").classList.remove("none");
  $("#mv").innerHTML = `<div class="loading">Caricamento…</div>`;
  disegnaTesta(); disegnaLista();
  vista("detail");
  if(wide()) $("#detail").scrollTo(0,0);
  await caricaMovimenti();
}

function disegnaTesta(){
  const s = corrente.saldo;
  $("#d-name").textContent = corrente.nome;
  $("#ccard").className = "ccard " + (s>0.004 ? "debt" : s<-0.004 ? "paid" : "");
  $("#d-state").textContent = s>0.004 ? "Deve pagare" : s<-0.004 ? "Ha pagato in anticipo" : "È in pari";
  $("#d-bal").textContent = eur(Math.abs(s));
  $("#btn-all").disabled = !(s>0.004);
  $("#all-txt").textContent = s>0.004 ? "Ha pagato tutto: " + eur(s) : "Ha pagato tutto";
}

async function caricaMovimenti(){
  const id = corrente.id;
  try{
    const r = await rpc("movimenti_cliente",{p_cliente:id});
    if(!Array.isArray(r)) return esci();
    if(!corrente || corrente.id!==id) return;
    corrente.saldo = r.filter(m=>!m.annullato).reduce((s,m)=>s+(m.tipo==="debito"?1:-1)*Number(m.importo),0);
    const c = clienti.find(x=>x.id===id); if(c){ c.saldo = corrente.saldo; disegnaLista(); }
    disegnaTesta();
    if(!r.length){ $("#mv").innerHTML = `<div class="empty">Ancora niente. Quando segni qualcosa, compare qui.</div>`; return; }
    let html = "", last = "";
    for(const m of r){
      const d = new Date(m.creato), g = giorno(d);
      if(g!==last){ html += `<div class="day">${g}</div>`; last = g; }
      const deb = m.tipo==="debito";
      const titolo = deb ? (m.nota || "Aggiunto al conto") : (m.nota==="saldo" ? "Ha pagato tutto" : m.nota ? "Ha pagato (" + m.nota + ")" : "Ha pagato");
      html += `<div class="mv ${m.annullato?"off":""}">
        <span class="nm"><b>${esc(titolo)}</b><small>ore ${ora(d)}${m.annullato?" · annullato":""}</small></span>
        <span class="v tab ${deb?"debt":"paid"}">${deb?"+ ":"− "}${eur(m.importo)}</span>
        <button class="x" data-id="${m.id}" data-off="${m.annullato}" data-t="${esc(titolo)}" data-v="${m.importo}">${m.annullato?"Ripristina":"Annulla"}</button>
      </div>`;
    }
    $("#mv").innerHTML = html;
  }catch(e){ offline(); }
}

$("#mv").onclick = e => {
  const b = e.target.closest(".x"); if(!b) return;
  const riattiva = b.dataset.off==="true";
  foglio(`<h3>${riattiva?"Rimettere":"Annullare"} questa riga?</h3>
    <p>${esc(b.dataset.t)}, ${eur(b.dataset.v)}.<br>${riattiva?"Tornerà a contare nel conto.":"Non conterà più nel conto, ma resta scritta nello storico."}</p>
    <div class="pair"><button class="big grigio" data-x>No</button><button class="big ${riattiva?"blu":"rosso"}" data-ok>${riattiva?"Sì, rimetti":"Sì, annulla"}</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudi;
      el.querySelector("[data-ok]").onclick = async ev => {
        ev.currentTarget.disabled = true;
        try{
          const r = await rpc("annulla_movimento",{p_id:b.dataset.id,p_annullato:!riattiva});
          if(r===null) return esci();
          chiudi(); avviso(riattiva ? "Riga rimessa" : "Riga annullata");
          await caricaMovimenti();
        }catch(err){ offline(); ev.currentTarget.disabled = false; }
      };
  });
};

$("#btn-back").onclick = () => { vista("home"); carica(); };
$("#btn-debt").onclick = () => foglioImporto("debito");
$("#btn-pay").onclick = () => foglioImporto("pagamento");
$("#btn-all").onclick = () => {
  const s = corrente.saldo; if(!(s>0.004)) return;
  foglio(`<h3>${esc(corrente.nome)} ha pagato tutto?</h3>
    <div class="display"><span>€</span><b class="tab">${fmt(s)}</b></div>
    <p>Il conto torna a zero.</p>
    <div class="pair"><button class="big grigio" data-x>No</button><button class="big verde" data-ok>Sì, ha pagato</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudi;
      el.querySelector("[data-ok]").onclick = async ev => { ev.currentTarget.disabled = true; await registra("pagamento", Math.round(s*100)/100, "saldo"); };
  });
};
$("#btn-edit").onclick = () => foglio(`
  <h3>Modifica ${esc(corrente.nome)}</h3><p>&nbsp;</p>
  <div class="stack">
    <button class="big grigio" data-a="nome">Cambia il nome</button>
    <button class="big vuoto" data-a="arch">Togli dalla lista</button>
    <button class="big grigio" data-x>Chiudi</button>
  </div>`, el => {
    el.querySelector("[data-x]").onclick = chiudi;
    el.querySelector("[data-a=nome]").onclick = () => foglioNome("Cambia il nome", corrente.nome, "Salva", async nome => {
      const r = await rpc("modifica_cliente",{p_cliente:corrente.id,p_nome:nome,p_archiviato:false});
      if(r===null) return esci();
      corrente.nome = nome;
      const c = clienti.find(x=>x.id===corrente.id); if(c) c.nome = nome;
      disegnaTesta(); disegnaLista(); avviso("Nome cambiato", nome);
    });
    el.querySelector("[data-a=arch]").onclick = () => {
      if(Math.abs(corrente.saldo)>0.004){ chiudi(); avviso("Non si può ancora", "Prima il conto deve essere a zero.", true); return; }
      foglio(`<h3>Togliere ${esc(corrente.nome)} dalla lista?</h3><p>Il suo storico resta salvato.</p>
        <div class="pair"><button class="big grigio" data-x>No</button><button class="big rosso" data-ok>Sì, togli</button></div>`, e2 => {
          e2.querySelector("[data-x]").onclick = chiudi;
          e2.querySelector("[data-ok]").onclick = async () => {
            try{
              const r = await rpc("modifica_cliente",{p_cliente:corrente.id,p_nome:corrente.nome,p_archiviato:true});
              if(r===null) return esci();
              const nome = corrente.nome;
              chiudi(); corrente = null; $("#detail").classList.add("none");
              vista("home"); await carica(); avviso("Tolto dalla lista", nome);
            }catch(err){ offline(); }
          };
      });
    };
  });

async function registra(tipo, importo, nota){
  const nome = corrente.nome;
  try{
    const r = await rpc("nuovo_movimento",{p_cliente:corrente.id,p_tipo:tipo,p_importo:importo,p_nota:nota||null});
    if(!r) return esci();
    chiudi();
    if(tipo==="debito") avviso("Aggiunti " + eur(importo), "al conto di " + nome);
    else if(nota==="saldo") avviso(nome + " ha pagato tutto", "Il conto è a zero");
    else avviso("Pagati " + eur(importo), "da " + nome);
    await caricaMovimenti();
  }catch(e){ offline(); document.querySelectorAll(".sheet button").forEach(b=>b.disabled=false); }
}

/* fogli */
function foglio(html, bind){
  chiudi();
  const v = document.createElement("div");
  v.className = "veil";
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  v.onclick = e => { if(e.target===v) chiudi(); };
  $("#sheet-root").appendChild(v);
  bind && bind(v);
}
function chiudi(){ $("#sheet-root").innerHTML = ""; }
addEventListener("keydown", e => { if(e.key==="Escape") chiudi(); });

/* importo con tastierino grande */
function foglioImporto(tipo){
  const d = tipo==="debito";
  const quick = d ? ["1,20","1,50","2,00","5,00"] : ["5,00","10,00","20,00","50,00"];
  let val = "";
  foglio(`<h3>${d ? "Quanto aggiungi al conto di " : "Quanto ha pagato "}${esc(corrente.nome)}?</h3>
    <div class="display"><span>€</span><b class="tab ph" id="disp">0,00</b></div>
    <div class="chips">${quick.map(q=>`<button data-q="${q}">${q}</button>`).join("")}</div>
    <div class="keys">${["1","2","3","4","5","6","7","8","9",",","0","del"].map(k=>`<button data-k="${k}" aria-label="${k==="del"?"Cancella":k}">${k==="del"?'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 5H9l-6 7 6 7h12z"/><path d="M17 9l-6 6M11 9l6 6"/></svg>':k}</button>`).join("")}</div>
    ${d ? `<input class="field" id="f-nota" placeholder="Cosa ha preso (se vuoi)" maxlength="200" autocomplete="off">` : ""}
    <div class="pair"><button class="big grigio" data-x>Indietro</button><button class="big ${d?"rosso":"verde"}" data-ok disabled>${d?"Aggiungi":"Conferma"}</button></div>`, el => {
      const disp = el.querySelector("#disp"), ok = el.querySelector("[data-ok]");
      const numero = () => { const n = parseFloat((val||"0").replace(",", ".")); return isFinite(n) ? Math.round(n*100)/100 : 0; };
      const show = () => {
        disp.textContent = val ? (val.includes(",") ? val : Number(val).toLocaleString("it-IT")) : "0,00";
        disp.classList.toggle("ph", !val);
        const n = numero();
        ok.disabled = !(n>0);
        ok.textContent = n>0 ? (d ? "Aggiungi " : "Conferma ") + eur(n) : (d ? "Aggiungi" : "Conferma");
      };
      el.querySelector(".chips").onclick = e => { const q = e.target.closest("button")?.dataset.q; if(!q) return; val = q.replace(/,00$/,""); show(); };
      el.querySelector(".keys").onclick = e => {
        const k = e.target.closest("button")?.dataset.k; if(!k) return;
        if(k==="del") val = val.slice(0,-1);
        else if(k===","){ if(!val.includes(",")) val = (val||"0") + ","; }
        else {
          const [i, dec] = val.split(",");
          if(dec!==undefined){ if(dec.length<2) val += k; }
          else if((i||"").length<4) val = (val==="0" ? "" : val) + k;
        }
        show();
      };
      el.querySelector("[data-x]").onclick = chiudi;
      ok.onclick = async () => {
        const n = numero(); if(!(n>0)) return;
        ok.disabled = true;
        const nota = el.querySelector("#f-nota")?.value.trim();
        await registra(tipo, n, nota);
      };
      show();
  });
}

function foglioNome(titolo, val, azione, onSave){
  foglio(`<h3>${titolo}</h3><p>Scrivi nome e cognome.</p>
    <input class="field" id="f-nome" placeholder="Es. Mario Rossi" maxlength="80" value="${esc(val)}" autocomplete="off" autocapitalize="words">
    <div class="pair"><button class="big grigio" data-x>Indietro</button><button class="big blu" data-ok>${azione}</button></div>`, el => {
      const inp = el.querySelector("#f-nome");
      el.querySelector("[data-x]").onclick = chiudi;
      const ok = async () => {
        const n = inp.value.trim(); if(!n){ inp.focus(); return; }
        if(n.toLowerCase()!==val.toLowerCase() && clienti.some(c=>c.nome.toLowerCase()===n.toLowerCase())
           && !confirm("C'è già un cliente che si chiama così. Vuoi aggiungerlo lo stesso?")) return;
        el.querySelector("[data-ok]").disabled = true;
        try{ await onSave(n); chiudi(); }catch(e){ offline(); el.querySelector("[data-ok]").disabled=false; }
      };
      el.querySelector("[data-ok]").onclick = ok;
      inp.onkeydown = e => { if(e.key==="Enter") ok(); };
      setTimeout(()=>inp.focus(), 80);
  });
}

function foglioPin(){
  foglio(`<h3>Cambia il PIN</h3><p>Il nuovo PIN deve avere 4 numeri. Va usato su tutti i telefoni del bar.</p>
    <input class="field" id="p1" type="password" inputmode="numeric" placeholder="Nuovo PIN" maxlength="4">
    <input class="field" id="p2" type="password" inputmode="numeric" placeholder="Scrivilo ancora" maxlength="4">
    <div class="pair"><button class="big grigio" data-x>Indietro</button><button class="big blu" data-ok>Salva</button></div>`, el => {
      el.querySelector("[data-x]").onclick = chiudi;
      el.querySelector("[data-ok]").onclick = async () => {
        const a = el.querySelector("#p1").value, b = el.querySelector("#p2").value;
        if(!/^\d{4}$/.test(a)) return avviso("PIN non valido", "Servono 4 numeri.", true);
        if(a!==b) return avviso("I due PIN sono diversi", "Riscrivili uguali.", true);
        try{
          const r = await rpc("cambia_pin",{p_nuovo:a});
          if(r===null) return esci();
          pin = a; try { localStorage.setItem(PIN_KEY, pin); } catch(e) {}
          chiudi(); avviso("PIN cambiato");
        }catch(e){ offline(); }
      };
      setTimeout(()=>el.querySelector("#p1").focus(), 80);
  });
}

/* avvio + aggiornamento automatico */
buildPad(); drawDots();
if(pin){ vista("home"); carica(); } else vista("login");
intro();
setInterval(() => { if(pin && document.visibilityState==="visible" && !$("#sheet-root").children.length) carica(); }, 30000);
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState==="visible" && pin){ carica(); if(corrente) caricaMovimenti(); }
});
</script>
